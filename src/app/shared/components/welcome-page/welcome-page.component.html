<div class="container-fluid vh-100 d-flex justify-content-center align-items-center bg-white">

  <div class="card shadow-lg border-0 text-center p-5"
       style="max-width: 500px; width: 100%; border-radius: 18px;">

    <!-- Título -->
    <h1 class="fw-bold mb-3" style="color: #503629;">
      Crepes & Waffles
    </h1>

    <p class="text-muted mb-4">
      Bienvenido<br>
      Ingresa a tu cuenta o crea una nueva para continuar
    </p>

    <!-- Botón Sign In -->
    <button
      mat-raised-button
      class="btn w-100 mb-3 text-white fw-semibold"
      style="background-color: #503629;"
      [routerLink]="['/auth/sign-in']">
      Iniciar sesión
    </button>

    <!-- Botón Sign Up -->
    <button
      mat-raised-button
      class="btn w-100 mb-3 fw-semibold"
      style="border: 1px solid #837363; color: #503629;"
      [routerLink]="['/auth/sign-up']">
      Crear cuenta
    </button>

    <!-- Recuperar contraseña -->
    <div class="mt-3">
      <a
        [routerLink]="['/auth/forgot-password']"
        style="color: #837363;">
        ¿Olvidaste tu contraseña?
      </a>
    </div>

  </div>

</div>
