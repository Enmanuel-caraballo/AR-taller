<ion-header class="app-header">
  <div class="header-content">
    <!-- Left Section: Avatar & Greeting -->
    <div class="start-section" >
      <div class="avatar-circle" id="options-trigger">
        {{ initial }}
      </div>
      <div class="user-greeting">
        <span class="user-name">Hello, {{ name }}</span>
      </div>
    </div>

    <!-- Right Section: Actions -->
    <div class="end-section">
      <button class="icon-btn search-btn">
        <ion-icon name="search-outline"></ion-icon>
      </button>

      <div class="separator"></div>

      <button (click)="openSideBar()" class="options-btn">
        <span>Opciones</span>
        <ion-icon name="chevron-down-outline"></ion-icon>
      </button>

      <ion-popover button (click)="openSideBar()" trigger="options-trigger" triggerAction="click" [dismissOnSelect]="true" class="custom-popover">
        <ng-template>
          <ion-content class="popover-menu">
            <ion-list lines="none">
              <ion-item button (click)="openSideBar()" detail="false">
                <ion-icon name="person-circle-outline" slot="start"></ion-icon>
                <ion-label>Mi Perfil</ion-label>
              </ion-item>
              <ion-item button detail="false">
                <ion-icon name="settings-outline" slot="start"></ion-icon>
                <ion-label>Configuración</ion-label>
              </ion-item>
              <div class="item-separator"></div>
              <ion-item button (click)="logout()" lines="none" detail="false" class="logout-item">
                <ion-icon name="log-out-outline" slot="start"></ion-icon>
                <ion-label>Cerrar Sesión</ion-label>
              </ion-item>
            </ion-list>
          </ion-content>
        </ng-template>
      </ion-popover>
    </div>
  </div>
</ion-header>
