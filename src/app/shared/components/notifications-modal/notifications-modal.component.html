<div class="nm-root">

  <!-- ── HEADER ─────────────────────────────────── -->
  <div class="nm-header">
    <div class="nm-handle"></div>

    <div class="nm-header-top">
      <div class="nm-title-wrap">
        <ion-icon name="notifications-outline" class="nm-header-icon"></ion-icon>
        <h2 class="nm-title">Notificaciones</h2>
        <span class="nm-badge" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
      </div>
      <ion-button fill="clear" class="nm-close" (click)="closeModal()">
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </div>

    <div class="nm-subhead" *ngIf="!isLoading && notifications.length > 0">
      <span class="nm-subtitle">
        {{ unreadCount > 0 ? unreadCount + ' sin leer' : 'Todo al día' }}
      </span>
      <button class="nm-mark-all" (click)="markAllAsRead()" *ngIf="unreadCount > 0">
        <ion-icon name="checkmark-done-outline"></ion-icon>
        Marcar todo leído
      </button>
    </div>
  </div>

  <!-- ── CONTENIDO ──────────────────────────────── -->
  <ion-content class="nm-content">

    <!-- Loading -->
    <div class="nm-loading" *ngIf="isLoading">
      <ion-spinner name="crescent" color="medium"></ion-spinner>
      <span>Cargando notificaciones…</span>
    </div>

    <!-- Empty state -->
    <div class="nm-empty" *ngIf="!isLoading && notifications.length === 0">
      <div class="nm-empty-icon">
        <ion-icon name="notifications-off-outline"></ion-icon>
      </div>
      <p class="nm-empty-title">Sin notificaciones</p>
      <p class="nm-empty-sub">Cuando alguien te notifique sobre un evento, aparecerá aquí.</p>
    </div>

    <!-- Lista -->
    <div class="nm-list" *ngIf="!isLoading && notifications.length > 0">
      <button
        class="nm-item"
        [class.nm-item--unread]="!notif.read"
        *ngFor="let notif of notifications"
        (click)="onNotifTap(notif)"
      >
        <div class="nm-item-icon" [class.nm-item-icon--unread]="!notif.read">
          <ion-icon name="notifications-outline"></ion-icon>
          <span class="nm-dot" *ngIf="!notif.read"></span>
        </div>

        <div class="nm-item-body">
          <p class="nm-item-msg">{{ notif.message }}</p>
          <span class="nm-item-date">
            <ion-icon name="time-outline"></ion-icon>
            {{ notif.date | date:'d MMM yyyy · HH:mm' }}
          </span>
        </div>

        <ion-icon
          name="ellipse"
          class="nm-unread-dot"
          *ngIf="!notif.read"
        ></ion-icon>
      </button>
    </div>

  </ion-content>
</div>
