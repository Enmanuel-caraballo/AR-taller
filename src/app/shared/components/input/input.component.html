<ion-input
  [type]="type"
  [label]="label"
  [value]="control.value || ''"
  labelPlacement="floating"
  (ionInput)="onType($event)">

  <ion-input-password-toggle
    *ngIf="type === 'password'"
    slot="end">
  </ion-input-password-toggle>

  <ion-textarea
  *ngIf="type === 'textArea'"
  >
  </ion-textarea>

</ion-input>
