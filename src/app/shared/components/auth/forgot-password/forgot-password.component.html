<div class="container-fluid vh-100 d-flex justify-content-center align-items-center bg-white">

  <div class="card shadow-lg border-0" style="width: 100%; max-width: 420px; border-radius: 16px;">

    <div class="card-body p-5">

      <div class="text-center mb-4">
        <h2 class="fw-bold" style="color: #503629;">
          Crepes & Waffles
        </h2>
        <p class="text-muted mb-0">
          Recuperar contraseña
        </p>
      </div>

      <!-- Email -->
      <div class="form-floating mb-3">
        <input type="email" class="form-control" id="email" placeholder="Email">
        <label for="email">Email/Username</label>
      </div>

      <!-- Botón principal -->
      <button 
        class="btn w-100 mb-3 text-white fw-semibold"
        style="background-color: #503629;">
        Recuperar Contraseña
      </button>

      <div class="text-center">
        <small class="text-muted">¿Ya tienes cuenta?</small><br>
        <a [routerLink]="['/auth/sign-in']"
           class="fw-semibold text-decoration-none"
           style="color: #503629;">
          Iniciar Sesión
        </a>
      </div>

    </div>
  </div>

</div>
